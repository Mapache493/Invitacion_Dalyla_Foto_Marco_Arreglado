<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel Privado | XV Dalyla</title>

    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg, #fff2f7, #f6d6e4
            );
            color: #70304e;
        }

        .contenedor {
            max-width: 460px;
            margin: 20px;
            padding: 45px 30px;
            text-align: center;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 35px
                rgba(126, 45, 82, 0.12);
        }

        .corona {
            font-size: 55px;
        }

        h1 {
            color: #963c67;
        }

        p {
            line-height: 1.7;
        }

        .boton {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 28px;
            background: #a13e70;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .boton:hover {
            background: #7d2d55;
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <div class="corona">♛</div>

        <h1>Mis XV Años · Dalyla</h1>

        <h2>Panel de Administración</h2>

        <p>
            Accede al sistema privado para
            consultar las confirmaciones,
            acompañantes y lista de invitados.
        </p>

        <a
            class="boton"
            href="https://script.google.com/macros/s/AKfycbweLESmMkULw7Sq0AR0YnQlv57gBTsr7CseVGf_UYIVX-Aiqd516KOLfIBFSsaqCsXO/exec"
            target="_blank"
            rel="noopener noreferrer">
            Abrir Panel Privado
        </a>

    </main>

</body>
</html>
